# Runs on every push and pull request. Three jobs, each on a fresh machine:
#
#   test       lint, unit tests, and the integration tests against a real PostgreSQL
#   airflow    installs Airflow, checks the DAG files load, then runs the daily DAG from start to finish
#   compose    checks that docker-compose.yaml is valid
#
# No job calls the real weather API. They use the stand-in server in tools/fake_open_meteo.py,
# so a run never fails because of someone else's outage and never uses up the free API allowance.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AIRFLOW_VERSION: "3.3.2"
  PYTHON_VERSION: "3.12"
  DB_URL: postgresql://fairfield:fairfield@localhost:5432/fairfield_test

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fairfield
          POSTGRES_PASSWORD: fairfield          # throwaway database that exists only for this job
          POSTGRES_DB: fairfield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fairfield -d fairfield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the project with its test tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # with TEST_DATABASE_URL set, the integration tests run too, once per PostgreSQL driver
      - name: Unit and integration tests
        env:
          TEST_DATABASE_URL: ${{ env.DB_URL }}
        run: pytest -v

  airflow:
    name: Airflow DAGs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fairfield
          POSTGRES_PASSWORD: fairfield
          POSTGRES_DB: fairfield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fairfield -d fairfield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_FAIRFIELD_WAREHOUSE: postgres://fairfield:fairfield@localhost:5432/fairfield_test
      FAIRFIELD_DB_URL: postgresql://fairfield:fairfield@localhost:5432/fairfield_test
      FAIRFIELD_FORECAST_URL: http://localhost:8089/v1/forecast
      FAIRFIELD_ARCHIVE_URL: http://localhost:8089/v1/archive
      FAIRFIELD_REQUEST_PAUSE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Airflow must be installed with its constraints file, which pins every dependency to a tested version
      - name: Install Airflow and the project
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" apache-airflow-providers-postgres \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install -e ".[dev]"

      - name: DAG files load and are wired up correctly
        run: pytest -v tests/test_dags.py

      - name: Start the stand-in weather API
        run: |
          python tools/fake_open_meteo.py --port 8089 &
          sleep 2

      - name: Prepare Airflow and the warehouse
        run: |
          airflow db migrate
          python -m fairfield_weather setup

      - name: Run the backfill DAG for one month
        run: airflow dags test fairfield_weather_backfill --conf '{"start_date":"2025-01-01","end_date":"2025-01-31"}'

      - name: Run the daily DAG
        run: timeout 300 airflow dags test fairfield_weather_daily

      # 12 sites x (31 backfilled days + 3 recent days) observed, and 12 sites x 7 days forecast
      - name: The warehouse holds what the runs should have loaded
        run: |
          python - <<'EOF'
          import os, psycopg2
          cur = psycopg2.connect(os.environ["FAIRFIELD_DB_URL"]).cursor()
          cur.execute("SELECT (SELECT count(*) FROM core.fact_weather_observed), (SELECT count(*) FROM core.fact_weather_forecast), "
                      "(SELECT count(*) FROM audit.data_quality_result WHERE NOT passed)")
          observed, forecast, failed_checks = cur.fetchone()
          print(f"observed={observed} forecast={forecast} failed_checks={failed_checks}")
          assert (observed, forecast, failed_checks) == (12 * 34, 12 * 7, 0)
          EOF

  compose:
    name: Docker Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yaml
        run: |
          cp .env.example .env
          docker compose config --quiet
